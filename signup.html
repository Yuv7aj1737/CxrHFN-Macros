<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CxrHFN — Create Account</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <div class="login-container">

        <a
            href="index.html"
            class="brand"
        >

            <span class="brand-dot"></span>

            CxrHFN

        </a>


        <div class="login-card">

            <div class="tag">
                CXRHFN ACCOUNT
            </div>

            <h1>
                Create account.
            </h1>

            <p class="subtitle">
                Create your account to purchase and manage your macros.
            </p>


            <form id="signupForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >
                    Create Account →
                </button>

            </form>


            <p
                id="message"
                class="message"
            ></p>


            <div class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="signup.js"></script>

</body>

</html>
